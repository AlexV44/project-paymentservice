databaseChangeLog:
  - changeSet:
      id: 002-create-payments-indexes
      author: alexv44
      changes:
        - createIndex:
            collectionName: payments
            keys: '{ order_id: 1 }'
            options: '{ name: "idx_payments_order_id" }'
        - createIndex:
            collectionName: payments
            keys: '{ user_id: 1, timestamp: -1 }'
            options: '{ name: "idx_payments_user_id_timestamp" }