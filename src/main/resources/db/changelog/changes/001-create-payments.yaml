databaseChangeLog:
  - changeset:
      id: 001-create-payments
      author: alexv44
      changes:
        - createCollection:
            collectionName: payments
            options: |
              {
                validator: {
                  $jsonSchema: {
                    bsonType: "object",
                    required: ["order_id", "user_id", "status", "timestamp", "payment_amount"],
                    properties: {
                      order_id: { bsonType: "binData" },
                      user_id: { bsonType: "binData" },
                      status: { enum: ["SUCCESS", "FAILED"] },
                      timestamp: { bsonType: "date" },
                      payment_amount: { bsonType: "decimal" }
                    }
                  }
                }
              }